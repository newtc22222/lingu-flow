[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
markers =
    postgres: requires a live PostgreSQL database (set POSTGRES_TEST_URL; see tests/README.md)
# Do not set addopts=-m "not postgres": that ANDs with `pytest -m postgres` and
# collects nothing. Postgres tests auto-skip when the DB is unreachable, so the
# default `pytest` run stays green without Docker. Explicit:
#   POSTGRES_TEST_URL=... python -m pytest -m postgres