name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

defaults:
  run:
    working-directory: backend

jobs:
  sqlite:
    name: SQLite suite (default)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pytest (exclude postgres mark)
        run: python -m pytest -q

  postgres:
    name: Postgres integrity suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linguflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/linguflow_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/linguflow_test
      ENVIRONMENT: development
      JWT_SECRET: ci_test_jwt_secret_not_for_production_use_32b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pytest (postgres mark only)
        run: python -m pytest -m postgres -q
